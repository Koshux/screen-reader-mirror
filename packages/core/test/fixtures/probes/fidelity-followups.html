<!--
  Fidelity follow-ups from the SPEC-003, SPEC-004, and SPEC-005 probes. One source for two checks:
  - Chrome: `pnpm ax:compare packages/core/test/fixtures/probes/fidelity-followups.html`.
  - Unit tests: test/fidelity-followups.test.ts loads one case at a time by its data-case.
  The style block sits outside every case root; happy-dom applies it when the page is loaded.
-->
<style>
  .row { display: flex; }
  .grid { display: grid; grid-template-columns: 100px 100px; }
  .inline { display: inline; }
  .block { display: block; }
  .inline-block { display: inline-block; }
</style>

<div data-case="name-from-content">
  <button>Save <span role="status">3</span></button>
  <button>Send <span role="group">to all</span></button>
  <button>Open <span role="list"><span role="listitem">menu</span></span></button>
  <button>Mark <span role="region" aria-label="read">unread</span></button>
  <a href="#x">Go <span role="note">new</span></a>
  <h2>Orders <span role="alert">1 failed</span></h2>
  <button>Show <details open><summary>more</summary>details</details></button>
</div>

<div data-case="label-name">

  <span id="lb">Total <span role="status">9</span></span><input type="text" aria-labelledby="lb">
</div>
