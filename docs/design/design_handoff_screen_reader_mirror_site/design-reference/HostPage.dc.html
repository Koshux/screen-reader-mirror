<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#fff;color:#0b0c0c;font-family:system-ui,sans-serif;height:100%;overflow:hidden;display:flex;flex-direction:column">
  <div style="height:48px;flex:none;background:#0b0c0c;display:flex;align-items:center;padding:0 40px;color:#fff;font-weight:700;gap:10px"><span style="width:28px;height:28px;border:2px solid #fff;border-radius:4px"></span>Council services</div>
  <div style="padding:28px 40px;max-width:600px;display:flex;flex-direction:column;gap:14px">
    <h1 style="margin:0;font-size:32px;line-height:1.1;outline:{{ h1Outline }};outline-offset:4px">Apply for a Blue Badge</h1>
    <p style="margin:0;font-size:17px">Use this service if you live in England.</p>
    <span style="display:block;font-size:20px;font-weight:700;margin-top:10px">Your details</span>
    <label style="display:block;font-size:16px">Full name</label>
    <div style="height:40px;border:2px solid #0b0c0c;max-width:420px"></div>
    <div style="display:flex;gap:12px;align-items:center;margin-top:4px">
      <div style="width:40px;height:40px;border:2px solid #0b0c0c;display:grid;place-items:center;outline:{{ btnOutline }};outline-offset:3px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0b0c0c" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></div>
      <div style="width:110px;height:64px;background:repeating-linear-gradient(45deg,#dde 0 8px,#eef 8px 16px);border:1px solid #b1b4b6;outline:{{ imgOutline }};outline-offset:3px"></div>
    </div>
    <div style="border-top:1px solid #b1b4b6;margin-top:10px;max-width:420px"><div style="display:flex;padding:10px 0;border-bottom:1px solid #b1b4b6"><span style="width:140px;font-weight:700">Fee</span><span>£10</span></div></div>
    <span style="display:inline-block;align-self:flex-start;background:#00703c;color:#fff;padding:10px 14px;font-weight:700;margin-top:8px">Continue</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:700,&quot;height&quot;:520},&quot;hl&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;h1&quot;,&quot;button&quot;,&quot;img&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const h = this.props.hl || '';
    const o = (k) => h === k ? '2px solid #ff6b4a' : 'none';
    return { h1Outline: o('h1'), btnOutline: o('button'), imgOutline: o('img') };
  }
}
</script>
</body>
</html>
