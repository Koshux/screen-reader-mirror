<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Soft corners; pills only for notes legends, toasts and the minimised panel" name="Radii and targets" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;box-sizing:border-box;font-family:var(--font-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}.s i{display:block;width:72px;height:44px;border-radius:8px;border:1px solid var(--border)}.s b{color:var(--text);font-weight:600;font-family:var(--font-mono);font-size:11px}</style></head><body class=""><div class="sw"><div class="s"><i style="border-radius:var(--radius-sm);border-color:var(--border-strong);background:var(--surface)"></i><b>--radius-sm</b><span>6 · marks</span></div><div class="s"><i style="border-radius:var(--radius-md);border-color:var(--border-strong);background:var(--surface)"></i><b>--radius-md</b><span>8 · controls</span></div><div class="s"><i style="border-radius:var(--radius-lg);border-color:var(--border-strong);background:var(--surface)"></i><b>--radius-lg</b><span>12 · panes, cards</span></div><div class="s"><i style="border-radius:var(--radius-xl);border-color:var(--border-strong);background:var(--surface)"></i><b>--radius-xl</b><span>14 · hero figure</span></div><div class="s"><i style="border-radius:var(--radius-pill);border-color:var(--border-strong);background:var(--surface)"></i><b>--radius-pill</b><span>pill</span></div><div class="s"><i style="width:44px;height:44px;border:1px dashed var(--primary)"></i><b>--hit</b><span>44 min target</span></div></div></body></html>
