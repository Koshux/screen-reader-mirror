<!-- @dsCard group="Colors" viewport="700x150" subtitle="Follows OS preference, or .theme-light" name="Ground and accent, light" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;box-sizing:border-box;font-family:var(--font-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}.s i{display:block;width:72px;height:44px;border-radius:8px;border:1px solid var(--border)}.s b{color:var(--text);font-weight:600;font-family:var(--font-mono);font-size:11px}</style></head><body class="theme-light"><div class="sw"><div class="s"><i style="background:var(--bg)"></i><b>--bg</b><span>page</span></div><div class="s"><i style="background:var(--surface)"></i><b>--surface</b><span>panels, bands</span></div><div class="s"><i style="background:var(--surface-2)"></i><b>--surface-2</b><span>hover, raised</span></div><div class="s"><i style="background:var(--text)"></i><b>--text</b><span>text</span></div><div class="s"><i style="background:var(--muted)"></i><b>--muted</b><span>secondary 7:1</span></div><div class="s"><i style="background:var(--border)"></i><b>--border</b><span>rules</span></div><div class="s"><i style="background:var(--border-strong)"></i><b>--border-strong</b><span>controls</span></div><div class="s"><i style="background:var(--primary)"></i><b>--primary</b><span>accent, links</span></div></div></body></html>
