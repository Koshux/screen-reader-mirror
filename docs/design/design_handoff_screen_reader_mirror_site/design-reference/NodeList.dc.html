<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-bd7651e7-87e9-4651-a78b-257047ee4cc9/styles.css">
<script src="_ds/nocturne-bd7651e7-87e9-4651-a78b-257047ee4cc9/_ds_bundle.js"></script>
</helmet>
<div style="display:flex;flex-direction:column;color:var(--color-text);font-family:var(--font-body)">
<sc-for list="{{ nodes }}" as="n" hint-placeholder-count="11">
  <div style="display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px solid var(--color-divider)"><span class="text-muted" style="font-family:ui-monospace,Menlo,monospace">{{ n.roleLabel }}</span><sc-if value="{{ n.hasName }}" hint-placeholder-val="{{ true }}"><span>{{ n.nameLabel }}</span></sc-if><sc-if value="{{ n.noName }}" hint-placeholder-val="{{ false }}"><span class="text-muted">(no name)</span></sc-if><sc-if value="{{ n.hasFlag }}" hint-placeholder-val="{{ false }}"><span class="tag tag-accent">{{ n.flag }}</span></sc-if></div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:420},&quot;nodes&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;MirrorNode[]&quot;}}"></script>
</body>
</html>
