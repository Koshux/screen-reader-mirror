version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    ignore:
      # TypeScript 7 is not yet supported by typescript-eslint (peer: <6.1) or by tsup's DTS
      # bundler (rollup-plugin-dts). Keep TS on 5.x until both support it; revisit when they do.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies", "ci"]
